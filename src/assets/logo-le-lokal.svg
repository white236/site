<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" role="img" aria-label="Le Lokal Ventoux – Conciergerie">
  <!-- "Le" -->
  <text x="100" y="82" text-anchor="middle"
    font-family="'Nunito', 'Arial Black', Arial, sans-serif"
    font-weight="900" font-size="80" fill="#1A1A1A">Le</text>
  <!-- Orange dot (period of "Le.") -->
  <circle cx="158" cy="53" r="12" fill="#F26522"/>

  <!-- "Lokal" – large -->
  <text x="190" y="168" text-anchor="middle"
    font-family="'Nunito', 'Arial Black', Arial, sans-serif"
    font-weight="900" font-size="110" fill="#1A1A1A">Lokal</text>
  <!-- White ring to mimic the 'o' counter shape -->
  <circle cx="106" cy="120" r="36" fill="white"/>
  <!-- Orange circle inside 'o' -->
  <circle cx="106" cy="120" r="20" fill="#F26522"/>

  <!-- "— VENTOUX —" -->
  <text x="190" y="196" text-anchor="middle"
    font-family="'Nunito', Arial, sans-serif"
    font-weight="800" font-size="20" fill="#F26522" letter-spacing="5">— VENTOUX —</text>

  <!-- "CONCIERGERIE" -->
  <text x="190" y="222" text-anchor="middle"
    font-family="'Nunito', Arial, sans-serif"
    font-weight="600" font-size="14" fill="#1A1A1A" letter-spacing="8">CONCIERGERIE</text>
</svg>
